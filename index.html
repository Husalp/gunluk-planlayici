<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Günlük Planlayıcı</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #202124;
      min-height: 100vh;
      transition: 0.3s;
    }

    body.dark {
      background: #181a1b;
      color: #f1f3f4;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    /* SIDEBAR */

    .sidebar {
      width: 230px;
      background: #ffffff;
      border-right: 1px solid #e5e7eb;
      padding: 25px 18px;
      display: flex;
      flex-direction: column;
      transition: 0.3s;
    }

    body.dark .sidebar {
      background: #202223;
      border-color: #333;
    }

    .logo {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 35px;
    }

    .logo span {
      color: #4f46e5;
    }

    .menu-title {
      font-size: 12px;
      color: #8a8f98;
      margin-bottom: 10px;
      padding-left: 10px;
      text-transform: uppercase;
    }

    .menu-item {
      padding: 11px 12px;
      border-radius: 9px;
      margin-bottom: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    .menu-item.active {
      background: #eef2ff;
      color: #4f46e5;
      font-weight: bold;
    }

    body.dark .menu-item.active {
      background: #292d4a;
    }

    .sidebar-bottom {
      margin-top: auto;
    }

    .theme-btn {
      width: 100%;
      border: none;
      background: transparent;
      padding: 11px 12px;
      text-align: left;
      cursor: pointer;
      border-radius: 9px;
      font-size: 14px;
      color: inherit;
    }

    .theme-btn:hover {
      background: #f1f3f5;
    }

    body.dark .theme-btn:hover {
      background: #2b2d2f;
    }

    /* MAIN */

    .main {
      flex: 1;
      padding: 35px;
      max-width: 1200px;
      margin: auto;
      width: 100%;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      gap: 20px;
    }

    .welcome h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .welcome p {
      color: #777;
      font-size: 14px;
    }

    body.dark .welcome p {
      color: #aaa;
    }

    .date-box {
      background: white;
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      font-size: 14px;
    }

    body.dark .date-box {
      background: #202223;
      border-color: #333;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 20px;
    }

    body.dark .stat {
      background: #202223;
      border-color: #333;
    }

    .stat-title {
      font-size: 13px;
      color: #777;
      margin-bottom: 10px;
    }

    body.dark .stat-title {
      color: #aaa;
    }

    .stat-value {
      font-size: 27px;
      font-weight: bold;
    }

    /* PROGRESS */

    .progress-box {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 25px;
    }

    body.dark .progress-box {
      background: #202223;
      border-color: #333;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .progress {
      width: 100%;
      height: 9px;
      background: #e8eaed;
      border-radius: 20px;
      overflow: hidden;
    }

    body.dark .progress {
      background: #36393b;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #4f46e5;
      border-radius: 20px;
      transition: width 0.3s;
    }

    /* TASK AREA */

    .tasks-box {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 22px;
    }

    body.dark .tasks-box {
      background: #202223;
      border-color: #333;
    }

    .tasks-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .add-area {
      display: grid;
      grid-template-columns: 1fr 150px 130px auto;
      gap: 9px;
      margin-bottom: 20px;
    }

    input,
    select {
      border: 1px solid #d8dce1;
      border-radius: 9px;
      padding: 11px 12px;
      font-size: 14px;
      background: white;
      color: #202124;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #4f46e5;
    }

    body.dark input,
    body.dark select {
      background: #292b2d;
      color: white;
      border-color: #444;
    }

    .add-btn {
      border: none;
      background: #4f46e5;
      color: white;
      padding: 11px 18px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }

    .add-btn:hover {
      opacity: 0.9;
    }

    /* TASK */

    .task {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 4px;
      border-bottom: 1px solid #eeeeee;
    }

    body.dark .task {
      border-color: #333;
    }

    .task:last-child {
      border-bottom: none;
    }

    .check {
      width: 19px;
      height: 19px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-info {
      flex: 1;
      min-width: 0;
    }

    .task-name {
      font-size: 15px;
      word-break: break-word;
    }

    .task.completed .task-name {
      text-decoration: line-through;
      color: #999;
    }

    .task-meta {
      display: flex;
      gap: 7px;
      margin-top: 5px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 20px;
      background: #f0f2f5;
      color: #555;
    }

    body.dark .tag {
      background: #333638;
      color: #bbb;
    }

    .priority-high {
      color: #c62828;
      background: #fdeaea;
    }

    .priority-medium {
      color: #a15c00;
      background: #fff4df;
    }

    .priority-low {
      color: #39734a;
      background: #eaf7ee;
    }

    body.dark .priority-high {
      background: #452727;
    }

    body.dark .priority-medium {
      background: #443822;
    }

    body.dark .priority-low {
      background: #263c2d;
    }

    .task-actions {
      display: flex;
      gap: 5px;
    }

    .action-btn {
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 16px;
      padding: 6px;
      border-radius: 7px;
    }

    .action-btn:hover {
      background: #f0f1f2;
    }

    body.dark .action-btn:hover {
      background: #333;
    }

    .empty {
      text-align: center;
      padding: 35px 10px;
      color: #888;
      font-size: 14px;
    }

    /* MOBILE */

    @media (max-width: 800px) {

      .sidebar {
        width: 70px;
        padding: 20px 10px;
      }

      .logo {
        font-size: 0;
        text-align: center;
      }

      .logo span {
        font-size: 22px;
      }

      .menu-title {
        display: none;
      }

      .menu-item {
        font-size: 0;
        text-align: center;
      }

      .menu-item::first-letter {
        font-size: 18px;
      }

      .theme-btn {
        font-size: 0;
        text-align: center;
      }

      .theme-btn::first-letter {
        font-size: 18px;
      }

      .main {
        padding: 20px 15px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .welcome h1 {
        font-size: 23px;
      }

      .date-box {
        width: 100%;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .add-area {
        grid-template-columns: 1fr;
      }

      .add-btn {
        width: 100%;
      }

      .task {
        align-items: flex-start;
      }

      .task-actions {
        flex-direction: column;
      }
    }

    @media (max-width: 500px) {

      .sidebar {
        display: none;
      }

      .main {
        padding: 18px 12px;
      }

      .tasks-box,
      .progress-box,
      .stat {
        border-radius: 11px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="logo">
      Günlük<span>Plan</span>
    </div>

    <div class="menu-title">Menü</div>

    <div class="menu-item active">
      🏠 Ana Sayfa
    </div>

    <div class="menu-item">
      📋 Görevler
    </div>

    <div class="menu-item">
      📊 İstatistikler
    </div>

    <div class="sidebar-bottom">
      <button class="theme-btn" onclick="toggleDarkMode()">
        🌙 Karanlık Mod
      </button>
    </div>

  </aside>

  <main class="main">

    <div class="topbar">

      <div class="welcome">
        <h1>Günaydın 👋</h1>
        <p>Bugünkü planını tamamlamaya hazır mısın?</p>
      </div>

      <div class="date-box" id="date"></div>

    </div>

    <section class="stats">

      <div class="stat">
        <div class="stat-title">Toplam Görev</div>
        <div class="stat-value" id="totalTasks">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">Tamamlanan</div>
        <div class="stat-value" id="completedTasks">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">İlerleme</div>
        <div class="stat-value" id="percentage">0%</div>
      </div>

    </section>

    <section class="progress-box">

      <div class="progress-header">
        <span>Bugünkü ilerleme</span>
        <strong id="progressText">0 / 0</strong>
      </div>

      <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>

    </section>

    <section class="tasks-box">

      <div class="tasks-title">
        Bugünün Görevleri
      </div>

      <div class="add-area">

        <input
          type="text"
          id="taskInput"
          placeholder="Yeni görev yaz..."
          maxlength="120"
        >

        <select id="category">
          <option value="Genel">📌 Genel</option>
          <option value="Ders">📚 Ders</option>
          <option value="Python">💻 Python</option>
          <option value="İngilizce">🇬🇧 İngilizce</option>
          <option value="Spor">🏃 Spor</option>
          <option value="Kişisel">👤 Kişisel</option>
        </select>

        <select id="priority">
          <option value="low">🟢 Düşük</option>
          <option value="medium" selected>🟡 Orta</option>
          <option value="high">🔴 Yüksek</option>
        </select>

        <button class="add-btn" onclick="addTask()">
          + Ekle
        </button>

      </div>

      <div id="taskList"></div>

    </section>

  </main>

</div>

<script>

  let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

  const dateElement = document.getElementById("date");

  const today = new Date();

  dateElement.textContent = today.toLocaleDateString("tr-TR", {
    weekday: "long",
    day: "numeric",
    month: "long",
    year: "numeric"
  });

  function saveTasks() {
    localStorage.setItem("tasks", JSON.stringify(tasks));
  }

  function addTask() {

    const input = document.getElementById("taskInput");
    const category = document.getElementById("category").value;
    const priority = document.getElementById("priority").value;

    const text = input.value.trim();

    if (!text) {
      alert("Lütfen bir görev yaz.");
      return;
    }

    tasks.push({
      id: Date.now(),
      text: text,
      category: category,
      priority: priority,
      completed: false
    });

    input.value = "";

    saveTasks();
    renderTasks();
  }

  function toggleTask(id) {

    const task = tasks.find(task => task.id === id);

    if (task) {
      task.completed = !task.completed;
    }

    saveTasks();
    renderTasks();
  }

  function deleteTask(id) {

    tasks = tasks.filter(task => task.id !== id);

    saveTasks();
    renderTasks();
  }

  function editTask(id) {

    const task = tasks.find(task => task.id === id);

    if (!task) return;

    const newText = prompt("Görevi düzenle:", task.text);

    if (newText === null) return;

    const trimmed = newText.trim();

    if (!trimmed) return;

    task.text = trimmed;

    saveTasks();
    renderTasks();
  }

  function getPriorityText(priority) {

    if (priority === "high") return "🔴 Yüksek";
    if (priority === "medium") return "🟡 Orta";
    return "🟢 Düşük";
  }

  function renderTasks() {

    const list = document.getElementById("taskList");

    list.innerHTML = "";

    if (tasks.length === 0) {

      list.innerHTML = `
        <div class="empty">
          Henüz görev eklemedin. 👌<br>
          Yukarıdan ilk görevini ekleyebilirsin.
        </div>
      `;

    } else {

      tasks.forEach(task => {

        const div = document.createElement("div");

        div.className = "task";

        if (task.completed) {
          div.classList.add("completed");
        }

        div.innerHTML = `
          <input
            class="check"
            type="checkbox"
            ${task.completed ? "checked" : ""}
            onchange="toggleTask(${task.id})"
          >

          <div class="task-info">

            <div class="task-name">
              ${escapeHTML(task.text)}
            </div>

            <div class="task-meta">

              <span class="tag">
                ${escapeHTML(task.category)}
              </span>

              <span class="tag priority-${task.priority}">
                ${getPriorityText(task.priority)}
              </span>

            </div>

          </div>

          <div class="task-actions">

            <button
              class="action-btn"
              onclick="editTask(${task.id})"
              title="Düzenle"
            >
              ✏️
            </button>

            <button
              class="action-btn"
              onclick="deleteTask(${task.id})"
              title="Sil"
            >
              🗑️
            </button>

          </div>
        `;

        list.appendChild(div);

      });

    }

    updateStats();
  }

  function updateStats() {

    const total = tasks.length;

    const completed = tasks.filter(task => task.completed).length;

    const percentage =
      total === 0
        ? 0
        : Math.round((completed / total) * 100);

    document.getElementById("totalTasks").textContent = total;

    document.getElementById("completedTasks").textContent = completed;

    document.getElementById("percentage").textContent =
      percentage + "%";

    document.getElementById("progressText").textContent =
      completed + " / " + total;

    document.getElementById("progressBar").style.width =
      percentage + "%";
  }

  function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
  }

  function toggleDarkMode() {

    document.body.classList.toggle("dark");

    localStorage.setItem(
      "darkMode",
      document.body.classList.contains("dark")
    );
  }

  if (localStorage.getItem("darkMode") === "true") {
    document.body.classList.add("dark");
  }

  document
    .getElementById("taskInput")
    .addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        addTask();
      }

    });

  renderTasks();

</script>

</body>
</html>
